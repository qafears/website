essay: |
  The charming and ever so fashionable Brad Goreski started his career as an intern at glamorous Vogue Magazine, then caught our attention as the quirky yet dapper Assistant Stylist to the catch-phrase slinging über-stylist to the stars Rachel Zoe on her epic show, The Rachel Zoe Project. We fell in love with Brad as we watched him take on demanding hours, pack boxes, and battle L.A. traffic driving from one celeb fitting to the next.

  Now we get the pleasure of watching Brad on his own terms. Cameras are still rolling for Brad as Lead Stylist in his own show on Bravo, It's a Brad Brad World. Brad opens his home and heart to the world by giving us a glimpse into the challenges of starting his own business, transitioning from an assistant to becoming his own boss, and nurturing a 10 year relationship with partner Gary Janetti, all while dishing the most incredible fashion on celebrity A-listers like Demi Moore and Jessica Alba. Glitter got Brad on the phone to give us a little insight into how he does it all: from gaining the celebrity clientele to his picks in spring trends and the teen celebrities he would love to style.
qa:
  - question: "Can you tell us what to expect on your show, It's a Brad Brad World? There seems to be a lot about your personal life and your styling life, right?"
    answer: |
      Yeah, there is. It's very much, I think, a balance. The show is focused on my building a business, me in the lead role as stylist as opposed to the assistant role the way I was on Rachel's show. I think people really get to see how I work, and how I develop. I am still kind of developing the process in which I work, and that was one of the reasons why I really wanted to do the show: to show the actual process behind getting a photo shoot and getting the client and all the work that goes into that.

      Yes, definitely my personal life and my family life are a big focus, because I really wanted to show people that other side of my life and the great people, my great boyfriend, and my family, the different puzzle pieces that make up who I am. I hope the audience enjoys them as much as I do.
  - question: "How is the show different from Rachel's show?"
    answer: |
      Bravo had the tendency of showing people at the top of their game, and Rachel is definitely that person. I had this weird dichotomy of being well known, but once I left I realized I had to prove myself as an independent stylist. It's a lot for a celebrity to put their image in your hands. I had to work really, really hard.

      The pace is really different. It's not about a revolving door in fittings, even though there is tons of fashion. It's more about go, go, go, go, then it's crickets. Having to deal with that pace was very frustrating, and that's where the drama lies in my show. It's about whether or not I get a job and the client likes me and wants to book me again. That's where the drama lies.
  - question: "Who are some of your celebrity clients right now?"
    answer: |
      Right now I am working with Jessica Alba, Rashida Jones, Abigail Spencer, Christina Ricci, Shay Mitchell, and I work with Demi Moore as well.
  - question: "Who are the celebrities that you would love to dress?"
    answer: |
      It's such an organic process of who I come to work with. Emma Watson is someone that I love. I think that she is really, really cool and chic. I actually would really like to dress Kristen Wiig. I love her! I've been lucky because I work with a lot of really funny women, and our fittings always [have] us rolling on the floor laughing, not literally but figuratively. I would love to dress Kristen Wiig. I think she is talented and so beautiful and obviously funny.
  - question: "What teen stars would you love to style or think have great style?"
    answer: |
      Teen celebrities? Chloë Moretz. I love Elle Fanning. I think she is divine and so sweet.
  - question: "What is it about you and your style that makes everyone want to take notice and watch your show?"
    answer: |
      I don't know. I think maybe because I kind of wear things that people wouldn't necessarily picture a guy wearing, and they want it that much for themselves. I feel like I'm kind of masculine and then showgirl at the same time. I definitely love to stand out. I have loved clothes my entire life, the more wacky the better for me.

      I kind of like to challenge guys. I think it's important to push the boundaries, especially in men's fashion, to let guys know it's ok to wear even something as simple as a blue oxford instead of a white shirt with your suit, or a bow tie instead of a tie. Let yourself become a bit of a character, and it's ok to be known for being stylish. It's a good thing.
  - question: "For teens who can't afford really expensive luxury items, what brands should they turn to, and what trends should they look forward to for Spring 2012?"
    answer: |
      I would say for me one of my favorite brands that I think does a really good job of keeping things fresh and fun is Kate Spade. They have lots of glitter and lots of color, of which I'm a huge, huge proponent. I think there are some easy fixes. I think everyone should own a denim shirt. They go with everything. They are very easy looking and cool and comfortable.

      I also think my big mission in life is to help get more color out into the street. Whatever you wear, [add] a colored pair of socks or a colored belt, or a colored pair of jeans. People are like, how do I wear color? You pick one thing that you want to present as your colored item and then you base neutrals all around that, unless you are going to color block, which is a whole other thing. I think easing into it is a really good thing. We are seeing more of it on the street and we are seeing a lot more guys putting it into their wardrobe. For me it's super exciting, because don't we all just want the world to be a more colorful place?
  - question: "Do you have any advice for younger people trying to make it in the business as a stylist or an editor?"
    answer: |
      Absolutely. The only thing I have to give is my experience, and my experience was I interned. I made a list of places I wanted to intern and started from the top and worked my way down. I made a list of all of the magazines I wanted to intern at, and I started with Vogue, and I was lucky enough to get an internship there.

      My big thing is definitely do internships, and when you are there, be willing. Be willing to do everything. I juggled Jamba Juice [orders] for weeks and weeks until they let me count jewelry, to picking up jewelry, until they let me be on set. It was a logical progression. Now I see people come in and they are like, when do I get to go to a fitting? And it's like, well, you have to kind of learn the machine and learn the ropes before that kind of stuff can happen. Also, set your sights really high. Don't set your sights somewhere in the middle: start with the best and work your way down.
  - question: "Are you writing a book, and if it's true, what's it going to be about?"
    answer: |
      It's very true: it's called Born to Be Brad. It will be out at the end of February. The book is about where my influences came from. How I got into fashion. What it was like interning, and how to be a good intern. It's also very much how I grew up in a small town in Canada. I was bullied all through school. It's about my life and how all of that shaped me into the person I am today, though it was a hard experience to go through.

      That experience in school was a very dark time in my life. I came out because I had such a strong family, really great friends, and strong guidance. I was always encouraged to be who I was in the midst of that. I hope it's an inspirational story to people. There are a lot of fashion tips. There are a lot of stories about getting into the industry. It's all done through my life so far. It looks really good and I'm proud of the writing. I hope people like it.
