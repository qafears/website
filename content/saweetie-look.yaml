essay: |
  Corsets have been a staple in women's undergarments since the Victorian Era, and even before. They helped give back support by distributing the weight of the breasts evenly across the chest, and the thighs support against the weight of many layers of petticoats, crinoline, and bustles, all while creating the fashionable silhouette of the time. This was way before the invention of the modern-day bra, which was patented by Caresse Crosby in 1914.

  By the '30s, the bra was beginning to be mass-produced and replaced the corset as the staple in women's undergarments. Though the hourglass silhouette remained popular, it also became a kind of symbol for female sensuality. Today, the waist trainer can be seen as the modern-day corset, creating a cinched waist and emphasizing feminine curves.

  This Saweetie look can be recreated with either a bustier gown with a slit, or a corset paired with a skirt with a slit, accessorized with a garter belt or thigh jewelry. This look is chic and sexy while revealing just enough. I'm sure anyone in this look would feel confident and sexy AF.
