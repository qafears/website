seo:
  title: "The Archives | Quentin Fears"
  description: "The portfolio of stylist and fashion creative director Quentin Fears: celebrity, editorial, commercial, and red carpet work."
  ogTitle: "The Archives | Quentin Fears"
  ogDescription: "A decade of styling: celebrity, editorial, commercial, and red carpet."
  ogType: "website"
hero:
  eyebrow: "The Archives"
  heading: "A decade of execution."
  intro: "Celebrity, editorial, commercial, red carpet. The point of view on the rest of this site is earned, and this is the work it is built on. Each tile is a shoot: click one to see the rest of it."
sections:
  - key: "celebrity"
    title: "Celebrity"
    intro: "Covers, portraits, and the looks that get photographed."
    shoots:
      - slug: "garcelle-beauvais"
        title: "Garcelle Beauvais"
        images:
          - src: "assets/img/gallery/garcelle-beauvais-sheen-magazine-cover.jpg"
            alt: "Garcelle Beauvais on the cover of Sheen Magazine, styled by Quentin Fears"
            cap: "Garcelle Beauvais, Sheen Magazine cover"
          - src: "assets/img/gallery/garcelle-beauvais-sheen-crown.jpg"
            alt: "Garcelle Beauvais in a black blazer dress and crystal crown for Sheen Magazine, styled by Quentin Fears"
            cap: "Garcelle Beauvais for Sheen Magazine"
          - src: "assets/img/gallery/garcelle-beauvais-sheen-suit.jpg"
            alt: "Garcelle Beauvais in a black suit with pink piping for Sheen Magazine, styled by Quentin Fears"
            cap: "Garcelle Beauvais for Sheen Magazine"
          - src: "assets/img/gallery/garcelle-beauvais-printed-ball-gown.jpg"
            alt: "Actress Garcelle Beauvais in a sculptural printed ball gown, styled by Quentin Fears"
            cap: "Garcelle Beauvais"
      - slug: "norman-reedus"
        title: "Norman Reedus"
        images:
          - src: "assets/img/gallery/g-celebrity-4.jpg"
            alt: "Actor Norman Reedus in a black leather jacket and grey tee, styled by Quentin Fears"
            cap: "Norman Reedus"
      - slug: "amy-weber"
        title: "Amy Weber"
        images:
          - src: "assets/img/gallery/amy-weber-glamour-cover.jpg"
            alt: "Amy Weber on the Glamour digital edition cover in a pink ostrich feather gown, styled by Quentin Fears"
            cap: "Amy Weber, Glamour cover"
          - src: "assets/img/gallery/amy-weber-lavender-gown.jpg"
            alt: "Amy Weber in a lavender ostrich feather gown with a full train, styled by Quentin Fears"
            cap: "Amy Weber, lavender feathers"
          - src: "assets/img/gallery/amy-weber-pink-feather-gown.jpg"
            alt: "Amy Weber in a pink ostrich feather gown on garden steps, styled by Quentin Fears"
            cap: "Amy Weber for Glamour"
      - slug: "tahj-mowry"
        title: "Tahj Mowry"
        images:
          - src: "assets/img/gallery/tahj-mowry-menswear-styling.jpg"
            alt: "Actor Tahj Mowry in a patterned knit polo and tailored camel trousers, styled by Quentin Fears"
            cap: "Tahj Mowry"
          - src: "assets/img/gallery/tahj-mowry-tailoring.jpg"
            alt: "Actor Tahj Mowry in a grey checked blazer, black trousers and white sneakers, styled by Quentin Fears"
            cap: "Tahj Mowry, tailoring off duty"
  - key: "editorial"
    title: "Editorial"
    intro: "Concept, mood, styling, and art direction as one authored point of view."
    shoots:
      - slug: "visionarios"
        title: "Visionarios Magazine"
        images:
          - src: "assets/img/gallery/visionarios-magazine-leather-and-leopard.jpg"
            alt: "Visionarios Magazine editorial: two models in black and white, one in a leather coat with puffed shoulders, one in a leopard-print suit, against a hung white sheet"
            cap: "Visionarios Magazine, leather and leopard"
          - src: "assets/img/gallery/visionarios-magazine-two-looks.jpg"
            alt: "Visionarios Magazine editorial: the pair side by side, the leather coat and the leopard suit worn open, in an overgrown courtyard"
            cap: "Visionarios Magazine, the pair"
          - src: "assets/img/gallery/visionarios-magazine-leather-coat-profile.jpg"
            alt: "Visionarios Magazine editorial: a model in a long leather coat with puffed shoulders and a spiked necklace, turned in profile"
            cap: "Visionarios Magazine, leather coat in profile"
          - src: "assets/img/gallery/visionarios-magazine-leather-coat-front.jpg"
            alt: "Visionarios Magazine editorial: the leather coat shot straight on against the white sheet, with the courtyard wall behind"
            cap: "Visionarios Magazine, straight on"
      - slug: "poolside-story"
        title: "Poolside story"
        images:
          - src: "assets/img/gallery/g-editorial-3.jpg"
            alt: "Editorial: a sequinned bodysuit and thigh-high boots with a rainbow pool float"
            cap: "Poolside story"
          - src: "assets/img/gallery/g-editorial-1.jpg"
            alt: "Editorial: a neon satin set styled on an inflatable poolside"
            cap: "Poolside story"
          - src: "assets/img/gallery/g-editorial-2.jpg"
            alt: "Editorial: a fringed tweed jacket and skirt with a pool cue and pink beret"
            cap: "House rules"
      - slug: "color-movement"
        title: "Color and movement"
        images:
          - src: "assets/img/gallery/g-editorial-7.jpg"
            alt: "Editorial: a bold printed gown caught in motion on a sunlit street"
            cap: "Color and movement"
          - src: "assets/img/gallery/g-editorial-6.jpg"
            alt: "Editorial: a gold sequinned jumpsuit on a palm-lined street"
            cap: "Gold hour"
          - src: "assets/img/gallery/g-editorial-5.jpg"
            alt: "Editorial: a bold printed co-ord and laced heels against desert palms"
            cap: "Print on print"
      - slug: "fringe-harness"
        title: "Fringe and harness"
        images:
          - src: "assets/img/gallery/g-menswear-1.jpg"
            alt: "Menswear editorial: a leather harness and long feather skirt, black and white"
            cap: "Fringe and harness"
          - src: "assets/img/gallery/g-menswear-4.jpg"
            alt: "Menswear editorial: an open white shirt and denim shorts against open sky"
            cap: "Wide open"
      - slug: "strange-memories"
        title: "Strange Memories | JÓN Magazine"
        images:
          - src: "assets/img/gallery/jon-magazine-strange-memories-fringed-shirt.jpg"
            alt: "Strange Memories for JÓN Magazine: model Cooper Jervis in a fringed suede shirt and black wide-brim hat, leaning against a vintage car, styled by Quentin Fears"
            cap: "Strange Memories, JÓN Magazine"
          - src: "assets/img/gallery/g-menswear-6.jpg"
            alt: "Strange Memories for JÓN Magazine: a painterly checked suit worn open against a mirrored mosaic column, styled by Quentin Fears"
            cap: "Strange Memories, mirror and mosaic"
          - src: "assets/img/gallery/g-menswear-8.jpg"
            alt: "Strange Memories for JÓN Magazine: a striped blazer worn open with white shorts beneath an American flag, styled by Quentin Fears"
            cap: "Strange Memories, stars and stripes"
          - src: "assets/img/gallery/jon-magazine-strange-memories-printed-polo.jpg"
            alt: "Strange Memories for JÓN Magazine: a wave-print polo and leopard bucket hat against a painted mural, styled by Quentin Fears"
            cap: "Strange Memories, wave print and leopard"
          - src: "assets/img/gallery/jon-magazine-strange-memories-car-interior.jpg"
            alt: "Strange Memories for JÓN Magazine: the model stretched across the bench seat of a vintage car in a striped knit and checked trousers, styled by Quentin Fears"
            cap: "Strange Memories, bench seat"
          - src: "assets/img/gallery/jon-magazine-strange-memories-opening-spread.jpg"
            alt: "The opening spread of Strange Memories in JÓN Magazine, photographed by Ted Sun and styled by Quentin Fears"
            cap: "Strange Memories, the opening spread in JÓN Magazine"
  - key: "commercial"
    title: "Commercial"
    intro: "Campaign work built to sell a product and hold a brand's point of view."
    shoots:
      - slug: "spring-awakening"
        title: "Spring Awakening windows"
        images:
          - src: "assets/img/gallery/spring-awakening-storefront.jpg"
            alt: "Spring Awakening at Walmart's Fashion Statement Windows in Bentonville: two window bays of spring looks in front of artist Muoi Le's large painted canvases"
            cap: "Spring Awakening, Walmart Fashion Statement Windows, Bentonville"
          - src: "assets/img/gallery/spring-awakening-pink-sunglasses.jpg"
            alt: "Spring Awakening window display: a mannequin in pink sunglasses and a denim jacket against hanging painted panels"
            cap: "Spring Awakening, painted panels behind denim"
          - src: "assets/img/gallery/spring-awakening-violet-dress.jpg"
            alt: "Spring Awakening window display: a violet puff-sleeve dress with a pink scarf beside a painted panel"
            cap: "Spring Awakening, violet and pink"
          - src: "assets/img/gallery/spring-awakening-accessories.jpg"
            alt: "Spring Awakening window display: spring handbags and flats on iridescent plinths against blue and green painted canvases"
            cap: "Spring Awakening, accessories on iridescent plinths"
          - src: "assets/img/gallery/spring-awakening-denim-and-floral.jpg"
            alt: "Spring Awakening window display: an embroidered chambray jacket over a yellow top, with more spring looks behind"
            cap: "Spring Awakening, embroidered chambray"
          - src: "assets/img/gallery/spring-awakening-swim-and-stripes.jpg"
            alt: "Spring Awakening display: a striped knit dress and kids' swim looks in front of a painted canvas"
            cap: "Spring Awakening, swim and stripes"
      - slug: "swim-campaign"
        title: "Swim campaign"
        images:
          - src: "assets/img/gallery/g-commercial-3.jpg"
            alt: "Swim campaign: a competitive swimmer mid-stroke in a racing lane"
            cap: "Swim campaign"
          - src: "assets/img/gallery/g-commercial-1.jpg"
            alt: "Swim campaign: two athletes on the deck of a competition pool"
            cap: "Swim campaign"
          - src: "assets/img/gallery/g-commercial-2.jpg"
            alt: "Swim campaign: two athletes in printed racing suits poolside"
            cap: "Swim campaign"
          - src: "assets/img/gallery/g-commercial-7.jpg"
            alt: "Swim campaign: two children in printed life vests jumping into a pool"
            cap: "Swim campaign, family"
      - slug: "evening-wear"
        title: "Evening wear"
        images:
          - src: "assets/img/gallery/g-commercial-4.jpg"
            alt: "Evening wear campaign: two navy sequinned gowns with high slits"
            cap: "Evening wear"
      - slug: "accessories"
        title: "Accessories"
        images:
          - src: "assets/img/gallery/g-commercial-8.jpg"
            alt: "Accessories campaign: a dusty pink suit with structured tan luggage"
            cap: "Accessories"
  - key: "red-carpet"
    title: "Red carpet"
    intro: "On a carpet the image is the whole message, and there is exactly one chance to get it right."
    shoots: []
clients:
  label: "Selected clients"
  names: "Alfre Woodard, Norman Reedus, Garcelle Beauvais, Tahj Mowry, Amy Weber, Macy Gray, Isis King, Skai Jackson, Kristina Arielle, Ray Santiago, Loren Lott, Keesha Sharp, EJ Johnson"
footnote: "A selection from a decade of work. The full archive is available on request."
cta:
  heading: "I take on a few brand projects at a time."
  body: "Creative direction, visual strategy, and campaign work for brands and agencies."
  buttonLabel: "Start a project"
  buttonHref: "contact"
