essay: |
  Searching for a special look, something head turning, perhaps even shocking? West Coast designer Atousa G. is making an impression with her unique and dynamic fashion line, A Line Called K, a perfect way to stir up the holidays. Her pieces are not for the faint of heart, which is just one of the many reasons you'll find A Line Called K on the red carpet. We caught up with Atousa G. to find out about the two W's: who's wearing her pieces, and where we can grab our own.
qa:
  - question: "When did you start your brand, A Line Called K?"
    answer: |
      In 2016, I started A Line Called K in San Francisco, as a hobby and creative outlet for me to style some of my DJ friends and artists in the music industry.
  - question: "How would you describe the aesthetic?"
    answer: |
      My line is a unique brand for those who want to stand out in a crowd and make a statement without saying a word. I wanted to make an exclusive, yet bold and edgy, line.
  - question: "Where do you see these bold pieces being worn? Also, how would you describe the A Line Called K customer?"
    answer: |
      I see my designs being worn primarily at music festivals. But I have pieces worn at red carpet events, extravagant parties, and I also custom design avant-garde pieces for those in our niche market who work in high-profile media positions. The A Line Called K customer is someone who lives every day like it was their last and wants to look fabulous doing it.
  - question: "Who are some of the big names who have worn your line?"
    answer: |
      My line is a hit with the music festivals globally. I've had the honor of styling some of the top DJs in the industry. Just recently, I styled DJ Tennis and Acid Pauli from Berlin. My clothing line has also been on NBC's The Voice, Bravo's Shahs of Sunset, VH1's Basketball Wives, fashion week hosts, actors and actresses, and more.
  - question: "Some of your pieces feature a giant eye. Does this have a spiritual meaning for you?"
    answer: |
      Being Persian, the eye symbolizes protection! I also love being at Burning Man, and all that people can see is this giant eye looking at them on the Playa. It's absolutely fascinating.
  - question: "Your line features womenswear and menswear, but also has a unisex line. Is designing for men different from designing for women?"
    answer: |
      I want both men and women to be able to feel majestic in the same design. So I'm proud to say I specialize in unisex pieces that tailor to both men and women. I want my customers to stand out in a crowd, and they will, simply because they're in A Line Called K. Being from San Francisco, I consider my clothes to be for everybody, no matter how they gender identify.
  - question: "Who are some of your favorite fashion icons?"
    answer: |
      Coco Chanel has always been an inspiration to me. Christian Dior and Yves Saint Laurent have been game-changers in the fashion world. I personally love Japanese designers. Yohji Yamamoto is one of my favorites.
  - question: "What about fashion and design are you most grateful for?"
    answer: |
      My grandfather had a fashion house in Tehran and made clothes for royalty. My uncle was also an amazing fashion designer in the 70s and 80s. Moving from Tehran to America at an early age was very difficult for me. As soon as I received my first sewing machine and was able to create my own fashion, I finally felt comfortable in my own skin. I felt free being able to design clothes I wanted to wear, especially as a teenager.

      Today, when I don't have the ability to create unique clothing and express my vision, I don't feel alive. I am honored and grateful to have amazing clients who love to express themselves by wearing my designs!
  - question: "What can we expect for next season?"
    answer: |
      I have been working on designs that are embellished, embossed, and have just the right amount of bling! I like the idea of recycling existing garments to give them a unique, one-of-a-kind look, without a large carbon footprint.
  - question: "Where can we find your line?"
    answer: |
      In New York, we work with one of the biggest venues, called Avant Gardner. We also work with the Great Northern in San Francisco. You can't find us in any malls, but I'm excited to announce we are working with a very cool store in San Francisco by the name of Ceiba SF. This will be one of our very first stores!
