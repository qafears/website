    src: "assets/img/press-behind-the-seams.jpg"
    alt: "Newsletter feature titled Behind the Seams: Inside Walmart Fashion's NYC Pop-Up, with a portrait of Quentin Fears and two photos of him in the styled pop-up shop"
    tag: "Press"
    label: "BAARG newsletter"
  source: "As featured in the newsletter of Walmart's Black & African American Resource Group (BAARG)"
qa:
  - question: "What does visual merchandising and styling actually do, and what drew you to this work?"
    answer: |
      It's really about storytelling through a fashion lens. I consider brand identity, fashion and market trends, seasonality, customer interests and demographics to create experiences that engage and delight the customer.

      We're not just selling a shirt or a pair of pants. We're helping customers see an identity or lifestyle they can make their own. When it's done well, the customer doesn't just see the blouse. They see the blouse with the skirt, the belt, the shoes and the accessories. Suddenly, they can envision the entire look and how it fits into their life.

      That ability to tell a story through product is what has always drawn me to this work. Fashion can communicate so much without saying a word.
    quote: ""
