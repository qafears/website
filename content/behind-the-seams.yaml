  - question: "How do you create a cohesive experience while allowing each brand to shine?"
    answer: |
      That thinking begins long before the product reaches the floor. Brand placement and adjacencies are incredibly important. What brand should the customer experience first? How should they naturally move through the space? Which brands make sense beside one another?

      We introduced customers to Free Assembly first, our modern American heritage brand with broad appeal. From there, the experience flows into Avia, with its athletic assortments positioned alongside the matching Free Assembly collections. Then customers discover Scoop, the more fashion-forward assortment; Scenariō, with its bohemian point of view; and accessories.

      Color is another powerful tool. Each brand needs to remain distinctive, but the color stories throughout the space should complement one another so the environment feels intentional. And we identify signature pieces that immediately say what each brand stands for. With Scenariō, denim is an important part of the story, so denim was the hero in the mannequin styling.
    quote: "It's almost like creating chapters within one larger story. Each brand has its own voice, but they all need to belong in the <span class=\"accent\">same book</span>."
    photos: []
  - question: "Was there a moment that stood out as especially rewarding?"
    answer: |
      I was helping a customer in the space when she looked around and said, "Who knew Walmart had such amazing pieces?" That was the moment I thought, this is working.

      Her favorite piece was a cropped Free Assembly trench jacket, and by the time she left, she had three bags of clothing. She came in with one perception and left with another. Seeing that shift happen in real time was incredibly rewarding.

      I'm grateful to have shared this with the Hoboken Visual Merchandising and Enterprise Styling team: Erica Brandon, Josh Danforth, Jason Cicchelli, Cayla Hutton-Pessoa, Alex Pacheco, Michelle Nagasawa and MaryFrances Gattine, along with our partners across the Fashion Office and Marketing. An experience of this scale is truly a team effort.
