  - question: "What was your role in bringing the pop-up, and brands like Free Assembly, Scoop, Avia and Scenariō, to life?"
    answer: |
      Bringing an experience of this scale to life was a collaborative effort across the Fashion Office, Marketing, Visual Merchandising & Styling and many other partners. My role is to make sure the fashion shows up in the strongest possible way: the fixtures supporting the product, how the assortment lives within the space, how the mannequins are styled, and how each brand keeps its identity while connecting with the customer in that particular market.

      One thing I think about a lot is geography. Styling for a New York customer can be different from styling for a customer in Los Angeles or Bentonville. You may be working with the exact same product, but how you combine and present those pieces changes with the audience, while still maintaining the integrity of the brand.

      There's strategy behind it, but there's also an art to it.
    quote: ""
