seo:
  title: "Behind the Seams | Quentin Fears | NYC Fashion Week pop-up"
  description: "Quentin Fears on the styling and visual merchandising behind a New York Fashion Week pop-up shop, from brand storytelling to space planning."
  ogTitle: "Behind the Seams | Quentin Fears"
  ogDescription: "An interview on the styling and visual strategy behind a New York Fashion Week pop-up."
  ogType: "article"
hero:
  eyebrow: "Interview"
  heading: "Behind the Seams"
  intro: "Inside Walmart Fashion's NYC Fashion Week pop-up: an inside look with Quentin Fears, Manager, Visual Merchandising & Styling Marketing."
clipping:
  image:
    src: "assets/img/press-behind-the-seams.jpg"
    alt: "Newsletter feature titled Behind the Seams: Inside Walmart Fashion's NYC Pop-Up, with a portrait of Quentin Fears and two photos of him in the styled pop-up shop"
    tag: "Press"
    label: "Walmart associate newsletter"
  source: "As featured in Walmart's associate newsletter"
  standfirst: |
    Fashion Week is often associated with the final reveal: the styles, the trends, and the moments that capture attention. But behind every activation is a team of creative thinkers translating vision into experience. As Walmart continues to evolve its fashion business through elevated brands, immersive customer experiences, and a growing presence in the style conversation, the recent NYC Fashion Week pop-up showcased the breadth of Walmart's fashion portfolio, featuring brands including Free Assembly, Scoop, Avia, and Scenariō.

    More than a showcase of products, the activation reflected the strategic brand building helping shape Walmart Fashion's continued evolution. The communications team sat down with Quentin Fears, a leader from the Visual Merchandising & Styling Marketing team, to get a behind-the-scenes look at the inspiration behind the experience. From concept to execution, here's a glimpse into the work that happens beyond the seams.
pullquote:
  quote: "It's almost like creating chapters within one larger story. Each brand has its own voice, but they all need to belong in the <span class=\"accent\">same book</span>."
  cite: "On building one experience out of many brands"
