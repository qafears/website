seo:
  title: "Behind the Seams | Quentin Fears | NYC Fashion Week pop-up"
  description: "Quentin Fears on the styling and visual merchandising behind a New York Fashion Week pop-up shop, from brand storytelling to space planning."
  ogTitle: "Behind the Seams | Quentin Fears"
  ogDescription: "An interview on the styling and visual strategy behind a New York Fashion Week pop-up."
  ogType: "article"
hero:
  eyebrow: "Interview"
  heading: "Behind the Seams"
  intro: "For Walmart's largest New York City pop-up, I led styling and visual merchandising across Free Assembly, Scoop, Avia, and Scenariō. The Black & African American Resource Group (BAARG) newsletter sat down with me about the thinking behind it."
