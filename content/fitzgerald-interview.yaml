essay: |
  Attention all city girls, we have a line for you! We caught up with designer Latoia Fitzgerald of Lionne. You may not know Latoia yet, but you have probably seen her clothing on the likes of Karrueche and Draya Michele. Latoia's line is elegant and sophisticated with a smart and palatable street edge. This line seems to be for the woman who knows where she's going, where she's from, and combines the two in a sexy, soft, yet tenacious package. We wanted to learn more about a woman with these qualities and to find out how Latoia creates this inimitable line.
qa:
  - question: "You grew up in a very creative environment, with a videographer as a father and a mother who was a seamstress making drapes and costumes for productions. What was it like growing up with artists as parents, and how did that inspire you to get into fashion?"
    answer: |
      It was great living in a creative household! I think being in the basement with my mother while she would sew and create is what inspired me to pursue a career in fashion.
  - question: "At 10 you taught yourself how to sew, and by high school you were making garments for other classmates. What was it like making your first pieces?"
    answer: |
      Making my first pieces was so much fun for me! I loved to explore. I was into using old leather pants or old denim jeans to create a new garment, and creating fashionable athletic jerseys for women. I feel like I was very creative when I first started, dyeing fabrics, adding chains, using textured fabrics, and much more.
  - question: "When you were making your first pieces, did you see yourself as a designer? Did you think it would turn out to be a full-blown career?"
    answer: |
      No, I didn't see myself as a designer. It was all fun and games for me when I first started. I just loved to create and make things.
  - question: "When did you officially start your line Lionne, and what was the initial inspiration?"
    answer: |
      I started Lionne in February 2018. My initial inspiration was to create a women's brand that would be cohesive with my kids' brand, Dillonger, but after creating Lionne it kind of blossomed into its own standalone brand. My initial plan was to create sweat suits and comfortable clothing to run around in, but my creative heart wanted more!
  - question: "Your clothing seems to effortlessly combine street style, like cargo pants and rompers, with a high-end je ne sais quoi, through ostrich feathers and luxury fabrics. How did you come up with this aesthetic, and who is the woman that embodies this sensibility?"
    answer: |
      She's definitely a city girl. The street style and high-end je ne sais quoi reads city girl all day! I naturally gravitate to quality fabrics. I might create sweatpants, but you best believe it won't be a basic pair of sweats!
  - question: "You've had some pretty famous people wearing your clothes, like Karrueche and Draya Michele. How did you get these heavy hitters in your pieces, and why do you think they are drawn to your work?"
    answer: |
      I think the clothing and quality speak for themselves. Draya and I have known each other for a long time because we're from the same city. She's been supporting my brands from day one.
